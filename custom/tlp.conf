# /etc/tlp.conf
# tlp.service must be enabled and started as systemd service, to ensure the settings work across reboots.

MEM_SLEEP_ON_AC=deep
MEM_SLEEP_ON_BAT=deep

# Battery charge level below which charging will begin.
START_CHARGE_THRESH_BAT0=0
# Battery charge level above which charging will stop.
STOP_CHARGE_THRESH_BAT0=80

# Use the dynamic powersave governor on both, but configure behavior below
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Set Intel Energy Performance Preferences (EPP)
# balance_performance allows normal snappy bursts on AC power.
# power forces the Intel driver to prioritize the 8 Efficient cores (E-cores).
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Disable Intel Turbo Boost completely when on battery
# This stops the Core i9 from spiking to 115W for light tasks.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Limit the maximum P-state performance percentage on battery
# Caps the max possible hardware frequency to 75% on battery as an extra safety net.
CPU_MAX_PERF_ON_AC=100
CPU_MAX_PERF_ON_BAT=60